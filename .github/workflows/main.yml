name: Server Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: server-deploy-main
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy to production server
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.0.3
        env:
          TURNSTILE_SITE_KEY: ${{ secrets.TURNSTILE_SITE_KEY }}
          TURNSTILE_SECRET_KEY: ${{ secrets.TURNSTILE_SECRET_KEY }}
          GUEST_IP_HASH_SECRET: ${{ secrets.GUEST_IP_HASH_SECRET }}
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          envs: TURNSTILE_SITE_KEY,TURNSTILE_SECRET_KEY,GUEST_IP_HASH_SECRET
          script_stop: true
          script: |
            set -eu

            APP_DIR="${{ secrets.DEPLOY_APP_DIR }}"
            BRANCH="${{ github.ref_name }}"
            RESTART_COMMAND="${{ secrets.DEPLOY_RESTART_COMMAND }}"
            HEALTH_URL="${{ secrets.DEPLOY_HEALTH_URL }}"

            has_compose_file() {
              [ -f docker-compose.yml ] || [ -f docker-compose.yaml ] || [ -f compose.yml ] || [ -f compose.yaml ]
            }

            run_compose_release() {
              docker compose build app
              docker compose run --rm app /app/bin/migrate
              docker compose up -d app
            }

            configure_guest_protection_env() {
              ENV_FILE="$APP_DIR/.env"

              if [ -z "$GUEST_IP_HASH_SECRET" ]; then
                echo "GUEST_IP_HASH_SECRET is required."
                exit 1
              fi

              if { [ -n "$TURNSTILE_SITE_KEY" ] && [ -z "$TURNSTILE_SECRET_KEY" ]; } || \
                 { [ -z "$TURNSTILE_SITE_KEY" ] && [ -n "$TURNSTILE_SECRET_KEY" ]; }; then
                echo "TURNSTILE_SITE_KEY and TURNSTILE_SECRET_KEY must be configured together."
                exit 1
              fi

              umask 077
              TMP_ENV="$(mktemp "$APP_DIR/.env.tmp.XXXXXX")"
              trap 'rm -f "$TMP_ENV"' EXIT

              if [ -f "$ENV_FILE" ]; then
                grep -v -E '^(TURNSTILE_SITE_KEY|TURNSTILE_SECRET_KEY|GUEST_IP_HASH_SECRET)=' \
                  "$ENV_FILE" > "$TMP_ENV" || true
              fi

              printf '\nGUEST_IP_HASH_SECRET=%s\n' "$GUEST_IP_HASH_SECRET" >> "$TMP_ENV"

              if [ -n "$TURNSTILE_SITE_KEY" ]; then
                printf 'TURNSTILE_SITE_KEY=%s\n' "$TURNSTILE_SITE_KEY" >> "$TMP_ENV"
                printf 'TURNSTILE_SECRET_KEY=%s\n' "$TURNSTILE_SECRET_KEY" >> "$TMP_ENV"
              fi

              chmod 600 "$TMP_ENV"
              mv "$TMP_ENV" "$ENV_FILE"
              trap - EXIT
            }

            if [ -z "$APP_DIR" ]; then
              echo "DEPLOY_APP_DIR is required."
              exit 1
            fi

            cd "$APP_DIR"
            git fetch origin "$BRANCH"
            git reset --hard "origin/$BRANCH"
            configure_guest_protection_env

            if [ -n "$RESTART_COMMAND" ]; then
              sh -lc "$RESTART_COMMAND"
              if has_compose_file; then
                docker compose run --rm app /app/bin/migrate
                docker compose up -d app
              fi
            elif has_compose_file; then
              run_compose_release
            elif systemctl list-unit-files 2>/dev/null | grep -q '^sticker\.service'; then
              sudo systemctl restart sticker
            else
              echo "No restart method found."
              echo "Set DEPLOY_RESTART_COMMAND to the exact server command, for example:"
              echo "docker compose up -d --build"
              echo "or:"
              echo "sudo systemctl restart sticker"
              exit 1
            fi

            if [ -z "$HEALTH_URL" ]; then
              HEALTH_URL="https://ai-sticker-maker.com/"
            fi

            for attempt in $(seq 1 12); do
              if curl -fsS "$HEALTH_URL" >/dev/null; then
                echo "Health check passed."
                exit 0
              fi

              echo "Health check failed, retrying ($attempt/12)..."
              sleep 5
            done

            echo "Health check failed after retries."
            exit 1
